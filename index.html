<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Randevu Al</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e774b7;
      max-width: 450px;
      margin: 40px auto;
      padding: 0 16px;
    }
    h1 { color: #c42995; }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      background-color: #c42995;
      color: rgb(248, 240, 244);
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Kuaför CEMİLE - Randevu Al</h1>
  <p>Aşağıdaki formu doldurarak randevu alabilirsiniz.</p>

  <form>
    <label>Adınız:</label>
    <input type="text" id="ad"><br><br>

    <label>Telefon:</label>
    <input type="tel" id="tel"><br><br>

    <label>Hizmet:</label>
    <select id="hizmet">
      <option>Saç Kesim</option>
      <option>Saç Boyası</option>
      <option>Saç Kesim +Boya</option>
      <option>Kaş Alma</option>
      <option>Epilasyon</option>
    </select><br><br>

    <label>Tarih:</label>
    <input type="date" id="tarih"><br><br>

    <label>Saat:</label>
    <select id="saat"></select><br><br>

    <button type="button" id="dugme" onclick="randevuAl()">Randevu Al</button>
  </form>

  <p id="sonuc"></p>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwVvQjfnz3VrsnwBG2ZD7YCZ6CCy5HBQvzuTvqTBjvW_xjsScNuOj8X4RxOG9aq_4871Q/exec";

    const saatKutusu = document.getElementById("saat");
    for (let h = 9; h < 20; h++) {
      for (const m of ["00", "30"]) {
        saatKutusu.add(new Option(String(h).padStart(2, "0") + ":" + m));
      }
    }
    document.getElementById("tarih").min = new Date().toISOString().slice(0, 10);

    async function randevuAl() {
      const ad = document.getElementById("ad").value.trim();
      const tel = document.getElementById("tel").value.trim();
      const hizmet = document.getElementById("hizmet").value;
      const tarih = document.getElementById("tarih").value;
      const saat = document.getElementById("saat").value;
      const sonuc = document.getElementById("sonuc");
      const dugme = document.getElementById("dugme");

      if (ad === "" || tel === "" || tarih === "") {
        sonuc.textContent = "Lütfen adınızı, telefonunuzu ve tarihi girin.";
        return;
      }
      if (tel.length < 10) {
        sonuc.textContent = "Telefon numarası en az 10 haneli olmalı.";
        return;
      }

      dugme.disabled = true;
      sonuc.textContent = "Gönderiliyor...";

      try {
        const cevap = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ ad, tel, hizmet, tarih, saat })
        });
        const sonucVeri = await cevap.json();
        if (sonucVeri.ok) {
          sonuc.textContent = ad + ", " + tarih + " " + saat + " için randevunuz alındı!";
        } else {
          sonuc.textContent = sonucVeri.mesaj;
        }
      } catch (hata) {
        sonuc.textContent = "Randevunuz Başarıyla Alınmıştır Bizi Tercih Ettiğiniz İçin Teşekkür Ederiz.";
      }
      dugme.disabled = false;
    }
  </script>
</body>
</html>
